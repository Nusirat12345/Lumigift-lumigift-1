name: Mutation Testing

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "stryker.config.js"
  schedule:
    # Every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  mutation-test:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Stryker
        id: stryker
        run: |
          npx stryker run --reporters html,clear-text,progress,json 2>&1 | tee stryker-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      - name: Extract mutation score
        id: score
        if: always()
        run: |
          SCORE=$(grep -oP 'Mutation score: \K[0-9.]+' stryker-output.txt || echo "unknown")
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Post mutation score as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const score = "${{ steps.score.outputs.score }}";
            const exitCode = "${{ steps.stryker.outputs.exit_code }}";
            const passed = exitCode === "0";
            const icon = passed ? "✅" : "❌";
            const body = [
              `## ${icon} Mutation Testing Report`,
              "",
              `**Mutation Score:** \`${score}%\``,
              `**Threshold:** \`70%\` (enforced — PR will be blocked if below)`,
              "",
              passed
                ? "Mutation score meets the required threshold."
                : "⚠️ Mutation score is below the 70% threshold. Please improve test coverage before merging.",
              "",
              "> Generated by [Stryker Mutator](https://stryker-mutator.io). Full HTML report is available as a CI artifact.",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === "github-actions[bot]" &&
              c.body.includes("Mutation Testing Report")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if mutation score below threshold
        if: steps.stryker.outputs.exit_code != '0'
        run: exit 1

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
