# Promtail — ships Lumigift's pino JSON stdout logs to Loki (Issue #337)
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL:-http://loki:3100}/loki/api/v1/push

scrape_configs:
  - job_name: lumigift
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.lumigift.logs=true"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: instance
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            app: app
            env: env
            event: event
            requestId: requestId
            correlationId: correlationId
            userId: userId
            giftId: giftId
      # pino emits numeric levels by default — map to names
      - template:
          source: level
          template: >-
            {{ if eq .Value "10" }}trace{{ else if eq .Value "20" }}debug{{ else if eq .Value "30" }}info{{ else if eq .Value "40" }}warn{{ else if eq .Value "50" }}error{{ else if eq .Value "60" }}fatal{{ else }}{{ .Value }}{{ end }}
      # requestId falls back to the logger's correlationId
      - template:
          source: requestId
          template: "{{ if .Value }}{{ .Value }}{{ else }}{{ .correlationId }}{{ end }}"
      - template:
          source: log_type
          template: '{{ if hasPrefix "audit" .event }}audit{{ else }}app{{ end }}'
      # Low-cardinality fields become labels
      - labels:
          level:
          service:
          app:
          env:
          log_type:
      # High-cardinality identifiers are queryable without bloating the index
      - structured_metadata:
          requestId:
          userId:
          giftId:
