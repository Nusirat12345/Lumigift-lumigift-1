# Loki — single-binary config for Lumigift log aggregation (Issue #337)
# Retention follows docs/ops/log-retention-policy.md:
#   application/error logs 30 days, audit + security/auth logs 90 days.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 720h # 30 days — application & error logs
  retention_stream:
    - selector: '{app="lumigift", log_type="audit"}'
      priority: 2
      period: 2160h # 90 days
    - selector: '{app="lumigift", service="auth"}'
      priority: 1
      period: 2160h # 90 days

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: ${ALERTMANAGER_URL:-http://alertmanager:9093}
  enable_api: true
