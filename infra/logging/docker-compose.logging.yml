# Log aggregation stack (Issue #337).
# Usage: docker compose -f docker-compose.yml -f infra/logging/docker-compose.logging.yml up -d
# Grafana Explore: http://localhost:3001 (datasource "Loki")
services:
  app:
    labels:
      com.lumigift.logs: "true"

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki-config.yml -config.expand-env=true
    volumes:
      - ./infra/logging/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./infra/logging/rules:/etc/loki/rules:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/promtail-config.yml -config.expand-env=true
    volumes:
      - ./infra/logging/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/logging/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki_data:
