# Prometheus alerting rules for the gift funnel (issue #355).
# Load via `rule_files` in prometheus.yml.
groups:
  - name: lumigift-gift-funnel
    rules:
      - alert: GiftClaimRateLow
        # Claimed vs. locked gifts over the last 7 days, summed across instances.
        expr: |
          sum(increase(gifts_claimed_total[7d]))
            / clamp_min(sum(increase(gifts_locked_total[7d])), 1)
            < 0.5
        for: 1h
        labels:
          severity: warning
          team: product
        annotations:
          summary: "Gift claim rate below 50% over 7 days"
          description: "Only {{ $value | humanizePercentage }} of gifts locked in the last 7 days were claimed."
